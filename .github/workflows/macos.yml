name: macOS tests
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '*.md']
  pull_request:
    paths-ignore: ['**/*.md', '*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Compile and inspect native helper
        run: |
          xcrun swiftc -swift-version 5 -O -target "$(uname -m)-apple-macosx14.0" -framework Cocoa -framework WebKit macos/FabBridge.swift -o /tmp/fab-library-macbridge
          /tmp/fab-library-macbridge --version
          /tmp/fab-library-macbridge --self-test
      - name: No-login diagnostic
        env:
          FAB_LIBRARY_HOME: /tmp/fab-library-ci
          FAB_LIBRARY_MAC_HELPER: /tmp/fab-library-macbridge
        run: |
          fab-library --json store doctor
          fab-library store free --help
