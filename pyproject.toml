[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fab-library"
version = "0.2.0"
description = "Windows-first, agent-friendly manager for your owned Fab Unreal Engine assets"
requires-python = ">=3.11"
dependencies = ["fab-downloader==1.3.0"]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"

[project.scripts]
fab-library = "fab_library.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
